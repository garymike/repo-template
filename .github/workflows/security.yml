name: Security

on:
  # Every PR, plus a weekly scan of main. If a ruleset requires PRs with these checks,
  # a push to main is a squash merge of a tree its PR just scanned, so a push trigger
  # repeats the same work. The schedule scans main on its own, and is the only trigger
  # that runs the audit job.
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
  # Opt back in to scanning pushes to main when either of these applies:
  # - the repo allows direct pushes to main, which no PR scan sees;
  # - the repo is public and uploads SARIF (sast, iac-security). Code scanning tracks
  #   main's alerts from runs on main, so without a push trigger a merged fix closes
  #   its alert, and a merged finding opens one, only at the next weekly run. Public
  #   repos run Actions free, so this costs nothing there.
  # push:
  #   branches: [main]
  # Don't broaden it to branches: ["**"]: feature branches are covered by their PR.

# Cancel superseded runs on the same ref (rapid pushes / PR updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default every job to read-only; a job that needs more raises it explicitly below.
permissions:
  contents: read

# Every job below calls a reusable workflow in garymike/security-workflows, pinned
# to a commit SHA. The caller's permissions block is a hard ceiling: a reusable
# workflow that asks for a permission the caller withheld fails at startup with
# no logs, so each job grants exactly what its callee declares. Do not add
# `secrets: inherit`; none of the callees need a secret.
#
# No comment beside the SHAs below, not even `# main`. Dependabot maintains a trailing
# comment only when it can resolve the ref to a version, and a branch ref has none, so
# whatever is written there rots on the next bump. zizmor's ref-version-mismatch reads
# `# main` as a claim that the pin equals main's head, which a pin to a moving branch
# only matches in the window after a pin move; five callers were reporting that warning
# on 2026-11-17. A bare SHA is quiet for both, because zizmor flags a missing comment
# only under its pedantic persona. The SHA is the record; resolve it for branch or date.

jobs:
  scan:
    permissions:
      contents: read
      packages: read       # reusable pulls the pinned betterleaks image from GHCR
      pull-requests: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@97f2e9ea0da2ac7bf1188138cff69bf2328c9640

  gha-security:
    # zizmor + actionlint over .github/workflows: injection, excessive permissions,
    # unpinned actions. Applies to every repo that has a workflow, i.e. this one.
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/gha-security.yml@97f2e9ea0da2ac7bf1188138cff69bf2328c9640

  sast:
    # Semgrep p/default. Drop this job only if the repo has no language Semgrep
    # understands (e.g. PowerShell-only, Bicep-only, or a README-only repo).
    permissions:
      contents: read
      packages: read
      security-events: write   # the callee declares this even when SARIF upload is off
    uses: garymike/security-workflows/.github/workflows/sast.yml@97f2e9ea0da2ac7bf1188138cff69bf2328c9640

  iac-security:
    # Checkov over Dockerfiles, compose, Bicep, Terraform, pipelines. Drop this job
    # if the repo carries no infrastructure-as-code.
    permissions:
      contents: read
      packages: read
      security-events: write   # the callee declares this even when SARIF upload is off
    uses: garymike/security-workflows/.github/workflows/iac-security.yml@97f2e9ea0da2ac7bf1188138cff69bf2328c9640

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@97f2e9ea0da2ac7bf1188138cff69bf2328c9640
